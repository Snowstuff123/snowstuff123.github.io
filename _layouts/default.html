<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  {% seo %}
  {% feed_meta %}

  <!-- Apply saved theme before first paint so there is no flash -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        if (saved === 'light' || saved === 'dark') {
          document.documentElement.setAttribute('data-theme', saved);
        }
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" />
  <link rel="stylesheet" href="{{ '/assets/css/johnjheisler.css' | relative_url }}" />
  <link rel="stylesheet" href="{{ '/assets/css/blog.css' | relative_url }}" />
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="page">

  <header>
    <a class="logo-mark" href="{{ '/' | relative_url }}">johnjheisler<span>.net</span></a>
    <div class="header-right">
      <nav class="site-nav" aria-label="Main">
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>home</a>
        <a href="{{ '/archive/' | relative_url }}"{% if page.url == '/archive/' %} aria-current="page"{% endif %}>archive</a>
        <a href="{{ '/tags/' | relative_url }}"{% if page.url == '/tags/' %} aria-current="page"{% endif %}>tags</a>
        <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>about</a>
        <a href="https://github.com/Snowstuff123" target="_blank" rel="noopener">github ↗</a>
      </nav>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle theme">
        <svg id="theme-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <span class="toggle-label" id="toggle-label">light</span>
      </button>
    </div>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer>
    <span class="footer-left"><strong>John Heisler</strong> · @snowstuff123</span>
    <span class="footer-right">
      <a href="{{ '/feed.xml' | relative_url }}">rss</a> ·
      <a href="{{ site.main_site }}">johnjheisler.com</a>
    </span>
  </footer>

  {% assign bg = site.static_files | where: "path", "/assets/bg-vector.svg" %}
  {% if bg.size > 0 %}
  <div class="bg-vector">
    <img src="{{ '/assets/bg-vector.svg' | relative_url }}" alt="">
  </div>
  {% endif %}

</div><!-- /.page -->

<script src="{{ '/assets/js/site.js' | relative_url }}"></script>
</body>
</html>
