# ── Site ─────────────────────────────────────────
title: PowerShell Blog
description: PowerShell scripts, Microsoft 365 administration, and IT systems administration notes by John Heisler.
author: John Heisler

# Change url to https://www.johnjheisler.net once the custom domain is connected.
url: "https://snowstuff123.github.io"
baseurl: ""

main_site: "https://www.johnjheisler.com"
github_username: Snowstuff123
twitter:
  username: snowstuff123
social:
  name: John Heisler

# ── Build ────────────────────────────────────────
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

# Matches Blogger's URL format (/2026/10/post-title.html) so old links keep working after migration.
permalink: /:year/:month/:title.html

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
